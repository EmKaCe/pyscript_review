general:
  Pandas:
    title: Pandas
    additional_notes: true
    positive:
    - main_point: Overall Pandas feedback
      sub_points:
      - text: Good use of Pandas
      - text: Good use of the Pandas functions
      - text: Good use of 'to_numpy()'
      - text: Good job on keeping a single DataFrame throughout the assignment
    neutral: []
    negative:
    - main_point: Reading Data Into Pandas
      sub_points:
      - text: Would have been clear enough to use a single DataFrame throughout the
          assignment, reducing the number of objects that were used
      - text: Delimiter (i.e., `sep`) - incorrectly specified the separator used within
          the CSV-formatted file
      - text: Header (i.e., `header`) - incorrectly specified the header line
      - text: Incorrectly read in the data
    - main_point: Cleaning Data
      sub_points:
      - text: data cleaning not done - you did not drop duplicated rows and/or rows
          with empty cells
      - text: '`drop_duplicates` - you did not save the results (e.g., using `inplace`
          or assigning it to a new object)'
      - text: '`dropna` - you did not save the results (e.g., using `inplace` or assigning
          it to a new object)'
      - text: drop column - you did not drop the id column
    - main_point: Miscelaneous
      sub_points:
      - text: 'Displaying Data: data is not displayed well (e.g., via a print statement)
          - should display data in a Pandas'' table when possible.'
  numpy:
    title: NumPy Library
    additional_notes: true
    positive:
    - main_point: The following points were well done
      sub_points:
      - text: Good use of Numpy functions.
    neutral:
    - main_point: The following points would improve your NumPy solution slightly
      sub_points:
      - text: 'NumPy: use the community abbreviation of ''np'''
      - text: Good use of '.shape', however it might have been better to use Torch's
          function, and thus reducing dependency on NumPy
      - text: Good use of '.reshape', however it might have been better to use Torch's
          function, and thus reducing dependency on NumPy
    negative: []
  sklearn:
    title: sklearn
    additional_notes: true
    positive:
    - main_point: Overall sklearn feedback
      sub_points:
      - text: Good use of sklearn
      - text: Good use of preprocessing.normalize
      - text: Good use of the sklearn functions
    neutral: []
    negative:
    - main_point: The following points were problems in your solution
      sub_points:
      - text: Data normalization - not done or incorrectly done
      - text: Data normalization - not done using sklearn's 'preprocessing.normalize'
      - text: Data normalization - not done using 'max' parameter
      - text: Data splitting - not done use sklearn's 'train_test_split'
      - text: Data splitting - not done use 'random_state=1' keyword and parameter
          combination
      - text: Data splitting object naming - (minor critique) would have been good
          for the names different than the sklearned example (e.g., not X_train etc.)
      - text: Model - did not use sklearn's 'LinearRegression' function
      - text: Model - did not train using the training dataset from the split
      - text: Model - did not evaluate the trained model (i.e., visualizing and/or
          computing R^2)
      - text: Model - did not evaluate the trained model using the testing data set
          from the split
      - text: R^2 - did not compute using one of the sklearn's function
      - text: Results - incorrectly computed (should have an R^2 value of ca. 57)
  FunctionsCases:
    title: User-defined Functions, Cases and Methods
    additional_notes: true
    positive:
    - main_point: Good use of the following
      sub_points:
      - text: docstring - providing context; stating what the cases, methods and/or
          functions do
      - text: docstring - defining input objects
      - text: docstring - defining returned object(s)
      - text: internal check - for example, 'if not isinstance'
      - text: isolating ideas to user-defined functions and/or cases
      - text: optional parameters - nice idea to include them
      - text: type hinting
    neutral:
    - main_point: Okay user-defined function(s), but the following could be improved
      sub_points:
      - text: complex - a bit too many ideas placed into a single function
    negative:
    - main_point: Cases/methods/user-defined functions
      sub_points:
      - text: Did not include cases for PyTorch neural network generation
      - text: Did not include appropriate methods within the case(s) created
      - text: The case(s) generated was not necessary - remember to K.I.S.S.
      - text: Poor user-defined/case functions
    - main_point: Missed opportunity
      sub_points:
      - text: You missed an obvious situation to crete a user-defined function that
          would have made your code more concise.
    - main_point: Your cases/methods/user-defined functions had the following problems
      sub_points:
      - text: complex - too many ideas place in a single function, which limits reusability,
          transferability and debugging
      - text: docstring - none provided for specifying context and usage
      - text: docstring - no statement about what the case/method/function does
      - text: docstring - no statement about what the input variables are
      - text: docstring - no statement about what is returned
      - text: global variables - use local variable in your case/function (e.g., improves
          transferability)
      - text: internal checks - none provided when necessary (e.g., 'if not isinstance')
      - text: main code - should be nested under the 'else' statement of the internal
          checking
      - text: trivial - case/method/function does very little, and arguably does not
          warrant being a function
      - text: type hinting - none provided
      - text: type hinting - incorrect type(s)
  callingFunction:
    title: Function (and Method) Calling
    additional_notes: true
    positive: []
    neutral: []
    negative:
    - main_point: ''
      sub_points:
      - text: keyword arguments calls - include the parameter that are being assigned
          the argument to (e.g., 'my_function(param1=arg1, param2=arg2)'. Doing so
          ensure that the arguments are passed correctly.
  PyTorch:
    title: PyTorch
    additional_notes: true
    positive:
    - main_point: Overall PyTorch feedback
      sub_points:
      - text: Good use of PyTorch
      - text: Well defined neural network
      - text: Good use of the PyTorch functions
      - text: Good use of 'from_numpy()'
      - text: Good use of 'to(torch.float32)'
      - text: Good use of '.reshape()'
      - text: Good use of '.shape()'
    neutral: []
    negative:
    - main_point: The following points were problems in your solution
      sub_points:
      - text: Activation functions (tanh and ReLU) - incorrectly used or defined
      - text: Backward propagation - improperly done or not done
      - text: Class - not created or poorly done
      - text: dtype - incorrectly data types (e.g., float64 and not float32)
      - text: Epochs - incorrect number defined
      - text: Features - incorrect number defined (e.g., in the input, hidden and/or
          output layers)
      - text: Forward propagation - improperly done or not done
      - text: Input tensors - not properly generated
      - text: Loss function - incorrectly or not defined
      - text: Model - did not train using three features, or the correct features
      - text: Model - did not train using the correct target feature
      - text: Model - did not train the model using the training dataset from the
          split
      - text: Model - did not evaluate the trained model using the testing data set
          from the split
      - text: Neural network - incorrectly sequences of layers and activation functions
      - text: Number of layers - incorrectly defined
      - text: 'Number of nodes per layers: incorrectly defined'
      - text: Optimization function - incorrectly defined and/or used
      - text: R^2 - not computed
      - text: Step function - incorrectly or not used
      - text: Results - incorrectly computed (should have an R^2 value of ca. 97)
  InterpretingCommenting:
    title: Interpreting and Commenting
    additional_notes: true
    positive:
    - main_point: Interpretation and comments
      sub_points:
      - text: Overall, nicely done and thought out
    neutral:
    - main_point: Interpretation and comments
      sub_points:
      - text: Could have been a bit more thoughtful
    negative:
    - main_point: Interpretation and comments
      sub_points:
      - text: Not done
      - text: Interpreted incorrectly
      - text: Interpreted incorrectly due to incorrect results
      - text: Interpreted incorrectly due to lack of results
      - text: Comments were too vague
assignment_specific: []
