general:
  SciPy - Mountains:
    title: SciPy - Mountains
    additional_notes: true
    positive:
    - main_point: The following points were well done
      sub_points:
      - text: Good job on getting the correct number of significant figures for the
          RMSE.
      - text: Good job on adding additional context that is meaningful.
      - text: Good job at consolidating similar ideas into individual code cells.
      - text: Good job on unifying the naming convention (i.e. CamelCase or Pot_Hole).
      - text: Good job on plotting both the mountain and timberline elevations into
          the same graph.
      - text: Good job on cleaning up the input data.
    neutral:
    - main_point: General
      sub_points:
      - text: Some of the context that was added could have been improved upon.
    - main_point: Pandas
      sub_points:
      - text: Should have dropped duplicate data values and any rows that had missing
          data.
    - main_point: Equation 1
      sub_points:
      - text: It might have been better to create a function for the Odland equation
          (i.e. Eq. 1), but okay.
    - main_point: Plots
      sub_points:
      - text: Okay to just plot the data as points, but would have been better to
          have a line with points.
      - text: Since you did not remove rows with missing data, your plots show gaps.
      - text: Should have ordered the data for the plots, which would have removed
          the jaggedness of the lines for Task 2.
    negative:
    - main_point: General
      sub_points:
      - text: The context at the top of the original solution notebook was not reworked.
          A better assignment context could have been provided.
      - text: Citation and reference to SciPy and Odland's original paper are missing.
      - text: The citations are not sequentially given - i.e the first citation is
          [3], not [1].
      - text: The references needed to be separated onto their own line for readability.
      - text: The object/variable naming should have been unified to follow one convention
          (i.e. CamelCase or Pot_Hole)
      - text: You have redundant citations being listed at the top and bottom of the
          notebook.
      - text: Including both data and df in an object's name (e.g. sc_testing_data_df)
          is not concise since they indicated the same thing. Should have been redone.
      - text: No user-defined functions were created, and there were several opportunities
          to do so.
    - main_point: Libraries
      sub_points:
      - text: The imports for Numpy and scipy.optimze should have been removed since
          they were not used.
      - text: The libraries should have been placed into a single code cell.
    - main_point: Plots
      sub_points:
      - text: A user-defined plotting function was an obvious thing that could have
          been created due to how many similar plots were asked for.
      - text: The data needed to be ordered based on the northing column after being
          read in by Pandas. This results in an ordered plotting of the data, unlike
          what was in the original solution.
      - text: Plotting the mountain and the timberline elevations together in a single
          plot would have allowed you to compare the data directly.
    - main_point: RMSE
      sub_points:
      - text: A user-defined RMSE function was an obvious to create here.
      - text: The values are incorrect - should be 85.2 and 70.2 meters
      - text: Missing the unit for the value - should be meters
      - text: The values have the incorrect number of significant figures, based on
          the raw input (e.g. 250.), the number of significant figures is 3. (Pandas
          incorrectly adds zeros.)
assignment_specific: []
