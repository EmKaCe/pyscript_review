general:
  userDefinedFunctions:
    title: User-defined Functions
    additional_notes: true
    positive:
    - main_point: Good use of the following
      sub_points:
      - text: docstring - providing context; stating what the function does
      - text: docstring - clearly defining all input variables/objects
      - text: docstring - clearly defining the returned object(s)
      - text: internal check - proper use of 'if not isinstance', 'raise' statements,
          etc.
      - text: isolating ideas to user-defined functions
      - text: optional parameters - nice idea to include them
      - text: type hinting - applied well for input variables (and what for what is
          returned, if applicable)
      - text: type hinting - good use of typing library
    neutral:
    - main_point: Okay user-defined function(s), but the following could be improved
      sub_points:
      - text: assert vs. raise - it is better to use 'raise' since 'assert' can be
          bypassed
      - text: complex - a bit too many ideas placed into a single function
    negative:
    - main_point: No user-defined functions employed
      sub_points:
      - text: Your solution did not include user-defined functions to isolate concepts,
          improves reusability, transferability and debugging
    - main_point: Missed opportunity
      sub_points:
      - text: You missed an obvious situation to crete a user-defined function that
          would have made your code more concise.
    - main_point: Your user-defined functions had the following problems
      sub_points:
      - text: complex - too many ideas place in a single function, which limits reusability,
          transferability and debugging
      - text: documentation - used comments instead of docstrings to provide context
          and usage for a function
      - text: docstring - poorly formatted (e.g., bad indentations, separation of
          ideas, etc.)
      - text: docstring - none provided for specifying context
      - text: docstring - no statement about what the input variables are
      - text: docstring - no statement about what the function returns
      - text: docstring - units should be specified for the input and out put variables/objects
      - text: global variables - use local variable in your function (e.g., improves
          transferability)
      - text: internal checks - none provided (e.g., 'if not isinstance')
      - text: internal checks - the check logic is overly complicated or too dense
          and should be separated for readability.
      - text: overall solution - creating a homework solution using primarily user-defined
          functions is not ideal, as it can make the code less concise and more difficult
          to follow
      - text: inconsistency - not all functions follow the same style (e.g., some
          have docstrings, some do not; some have internal checks, some do not)
      - text: structure - main code logic should be nested under the internal checks
          (e.g., within an else statement) for proper flow control
      - text: trivial function - does very little, and arguably does not warrant being
          a function
      - text: type hinting - incorrect type(s)
      - text: type hinting - none provided
      - text: types redundancy - type hinting is enough, no need to also specify the
          types again in the docstring
  callingFunction:
    title: Function (and Method) Calling
    additional_notes: true
    positive: []
    neutral: []
    negative:
    - main_point: ''
      sub_points:
      - text: formatting - placing each parameter being passed onto a new line is
          not necessary and makes the code less concise
      - text: keyword arguments calls - include the parameter that are being assigned
          the argument to (e.g., 'my_function(param1=arg1, param2=arg2)'. Doing so
          ensure that the arguments are passed correctly.
assignment_specific: []
