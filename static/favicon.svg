<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <!-- Cuts a transparent gap in the flask outline to let the checkmark breathe -->
    <mask id="check-cutout">
      <rect width="32" height="32" fill="white" />
      <path d="M7 16 L13.5 22.5 L27 7" fill="none" stroke="black" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    </mask>
  </defs>

  <g fill="none" stroke="oklch(0.55 0.2 265)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Masked Flask Elements -->
    <g mask="url(#check-cutout)">
      <path d="M12 5 V12 L4 25 A2 2 0 0 0 5.5 28 H26.5 A2 2 0 0 0 28 25 L20 12 V5" />
      <line x1="10" y1="5" x2="22" y2="5" />
    </g>
    
    <!-- Checkmark Overlay -->
    <path d="M7 16 L13.5 22.5 L27 7" />
  </g>
</svg>
